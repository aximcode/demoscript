title: "API Flow Diagram Demo"
description: "Demonstrates animated flow diagrams that sync with demo steps"
version: "1.0"
author: "DemoScript"
tags:
  - api
  - flow-diagram
  - visualization

metadata:
  duration: "3 minutes"
  difficulty: beginner
  category: "Tutorial"

settings:
  base_url: "https://apis.aximcode.com/v1"
  openapi: "https://apis.aximcode.com/v1/openapi.json"

  # Flow diagram configuration - auto-generated with node customization
  diagram:
    enabled: true
    direction: TD                 # Top-down flow for sidebar
    position: sidebar
    height: 400
    # Node customization (labels and shapes)
    nodes:
      Client:
        label: "Client"
        shape: stadium            # Rounded ends for external actors
      Gateway:
        label: "API Gateway"
        shape: rectangle
      API:
        label: "API Server"
        shape: rectangle
      DB:
        label: "Database"
        shape: cylinder           # Database shape

  effects:
    confetti: true
    sounds: true
    transitions: true

steps:
  # Introduction
  - slide: |
      # API Flow Diagram Demo

      This demo shows how the flow diagram highlights each step
      in your API architecture as you progress through the demo.

      Watch the sidebar diagram - edges turn **green** when completed
      and **purple** when active.

      **Diagram features:**
      - Auto-generated from step `diagram:` properties
      - Animated particles on active edges
      - Clickable nodes to navigate
    title: "Welcome"
    diagram: Client

  # Step 1: Client to Gateway
  - rest: POST /auth/login
    title: "Authenticate"
    description: "Client sends credentials to the API Gateway"
    diagram: Client->Gateway
    defaults:
      email: "demo@example.com"
      password: "demo123"
    save:
      token: token
    results:
      - key: token
        label: "Access Token"
        type: id

  # Step 2: Gateway to API
  - slide: |
      # Request Processing

      The API Gateway validates the token and forwards
      the request to the API Server.

      **Auto-generation tip:**
      The edge `Gateway->API` was automatically added
      to the diagram from this step's `diagram:` property.
    title: "Gateway to API"
    diagram: Gateway->API

  # Step 3: API to Database
  - rest: GET /users
    title: "Fetch Data"
    description: "API Server queries the database"
    diagram: API->DB
    results:
      - key: users
        label: "Users"
        type: json

  # Complete
  - slide: |
      # Flow Complete!

      The diagram shows the vertical request flow:

      1. **Client -> Gateway**: Authentication
      2. **Gateway -> API**: Request forwarding
      3. **API -> DB**: Data retrieval

      All edges are now green!

      **Three diagram modes:**
      - `chart:` - Custom Mermaid syntax (full control)
      - `nodes:` - Auto-generate edges, customize nodes
      - `enabled: true` - Fully automatic
    title: "Complete"
    diagram: DB
