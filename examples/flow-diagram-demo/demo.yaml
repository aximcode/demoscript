title: "API Flow Diagram Demo"
description: "Demonstrates animated flow diagrams that sync with demo steps"
version: "1.0"
author: "DemoScript"
tags:
  - api
  - flow-diagram
  - visualization

metadata:
  duration: "3 minutes"
  difficulty: beginner
  category: "Tutorial"

settings:
  base_url: "/sandbox"
  openapi: "/sandbox/openapi.json"

  # Flow diagram configuration - vertical linear flow for sidebar
  diagram:
    chart: |
      flowchart TD
        Client([Client])
        Gateway[API Gateway]
        API[API Server]
        DB[(Database)]

        Client --> Gateway
        Gateway --> API
        API --> DB
    position: sidebar
    height: 400

  effects:
    confetti: true
    sounds: true
    transitions: true

steps:
  # Introduction
  - slide: |
      # API Flow Diagram Demo

      This demo shows how the flow diagram highlights each step
      in your API architecture as you progress through the demo.

      Watch the sidebar diagram - edges turn **green** when completed.
    title: "Welcome"
    diagram: Client

  # Step 1: Client to Gateway
  - rest: POST /auth/login
    title: "Authenticate"
    description: "Client sends credentials to the API Gateway"
    diagram: Client->Gateway
    defaults:
      email: "demo@example.com"
      password: "demo123"
    save:
      token: token
    results:
      - key: token
        label: "Access Token"
        type: id

  # Step 2: Gateway to API
  - slide: |
      # Request Processing

      The API Gateway validates the token and forwards
      the request to the API Server.
    title: "Gateway → API"
    diagram: Gateway->API

  # Step 3: API to Database
  - rest: GET /users
    title: "Fetch Data"
    description: "API Server queries the database"
    diagram: API->DB
    results:
      - key: users
        label: "Users"
        type: json

  # Complete
  - slide: |
      # Flow Complete!

      The diagram shows the linear request flow:

      1. **Client → Gateway**: Authentication
      2. **Gateway → API**: Request forwarding
      3. **API → DB**: Data retrieval

      All edges are now green ✓
    title: "Complete"
    diagram: DB
